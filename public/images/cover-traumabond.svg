    <polygon points="0,-48 48,0 0,48 -48,0" fill="none" stroke="#BD7469" stroke-width="3" />
    <circle r="12" fill="#BD7469" />
    <line x1="-120" y1="0" x2="-80" y2="0" stroke="#BD7469" stroke-width="2" stroke-opacity="0.6" />
    <line x1="80" y1="0" x2="120" y2="0" stroke="#BD7469" stroke-width="2" stroke-opacity="0.6" />
  </g>

  <!-- Title -->
  <text x="707" y="920" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="76" font-weight="normal" fill="#382E2B">
