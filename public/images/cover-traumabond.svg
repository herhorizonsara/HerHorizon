  <rect x="66" y="66" width="1282" height="1868" rx="18" fill="none" stroke="#BD7469" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Top Header -->
  <text x="707" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="28" letter-spacing="8" font-weight="bold" fill="#BD7469">
